<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Condutores</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topo">
    <a href="index.html">⬅ Voltar</a>
    <h1>Cadastro de Condutores</h1>
  </div>

  <div class="card">

    <input type="text" id="cargo" placeholder="Cargo">

    <input type="text" id="nome" placeholder="Nome">

    <input type="text" id="telefone" placeholder="Telefone">

    <select id="situacao">
      <option>Em missão</option>
      <option>Ocioso</option>
      <option>Indisponível</option>
    </select>

    <button onclick="salvarCondutor()">Salvar</button>

    <ul id="listaCondutores"></ul>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
