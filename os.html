<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Ordem de Serviço</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topo">
    <a href="index.html">⬅ Voltar</a>
    <h1>Ordem de Serviço</h1>
  </div>

  <div class="card">

    <input type="text" id="ficha" placeholder="Número da ficha">

    <input type="datetime-local" id="saida">

    <input type="datetime-local" id="retorno">

    <input type="text" id="natureza" placeholder="Natureza do serviço">

    <input type="text" id="itinerario" placeholder="Itinerário">

    <input type="text" id="local" placeholder="Local de apresentação">

    <input type="text" id="oficial" placeholder="Oficial responsável">

    <input type="text" id="chefe" placeholder="Chefe da viatura">

    <button onclick="salvarOS()">Salvar</button>

    <ul id="listaOS"></ul>

  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
